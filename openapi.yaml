openapi: 3.1.0
info:
  title: Admin API
  description: Admin API for Bible Garden data management
  version: 0.1.0
paths:
  /api/chapter_with_alignment:
    get:
      tags:
      - Excerpts
      summary: Get Chapter With Alignment
      description: "Get chapter with alignment by book and chapter number\n\nArgs:\n\
        \    translation: Translation code\n    book_number: Book number (1-66)\n\
        \    chapter_number: Chapter number\n    voice: Voice code (optional)\n\n\
        Returns:\n    ExcerptWithAlignmentModel: Chapter data with alignment"
      operationId: get_chapter_with_alignment
      security:
      - APIKeyHeader: []
      parameters:
      - name: translation
        in: query
        required: true
        schema:
          type: integer
          title: Translation
      - name: book_number
        in: query
        required: true
        schema:
          type: integer
          title: Book Number
      - name: chapter_number
        in: query
        required: true
        schema:
          type: integer
          title: Chapter Number
      - name: voice
        in: query
        required: false
        schema:
          title: Voice
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcerptWithAlignmentModel'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
          description: Unprocessable Entity
  /api/excerpt_with_alignment:
    get:
      tags:
      - Excerpts
      summary: Get Excerpt With Alignment
      operationId: get_excerpt_with_alignment
      security:
      - APIKeyHeader: []
      parameters:
      - name: translation
        in: query
        required: true
        schema:
          type: integer
          title: Translation
      - name: excerpt
        in: query
        required: true
        schema:
          type: string
          title: Excerpt
      - name: voice
        in: query
        required: false
        schema:
          title: Voice
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExcerptWithAlignmentModel'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
          description: Unprocessable Entity
  /api/check_translation:
    get:
      tags:
      - Translations
      summary: Check Translation
      operationId: check_translation
      security:
      - HTTPBearer: []
      parameters:
      - name: translation
        in: query
        required: true
        schema:
          title: Translation
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/check_voice:
    get:
      tags:
      - Voices
      summary: Check Voice
      operationId: check_voice
      security:
      - HTTPBearer: []
      parameters:
      - name: voice
        in: query
        required: true
        schema:
          title: Voice
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/audio/{translation}/{voice}/{book}/{chapter}.mp3:
    options:
      tags:
      - Audio
      - Audio
      summary: Get Audio File
      description: "Returns mp3 file with HTTP Range requests support for iOS/Android\
        \ players\n\nArgs:\n    translation: Translation code (e.g.: syn, rst, bsb)\n\
        \    voice: Voice code (e.g.: bondarenko, barry_hays)  \n    book: Book number\
        \ (e.g.: 01, 19, 40)\n    chapter: Chapter number (e.g.: 01, 14, 150)\n  \
        \  request: HTTP request\n    api_key: API key (query parameter or X-API-Key\
        \ header)\n    \nReturns:\n    Audio file or its part with correct headers"
      operationId: get_audio_file_api_audio__translation___voice___book___chapter__mp3_options
      parameters:
      - name: translation
        in: path
        required: true
        schema:
          type: string
          title: Translation
      - name: voice
        in: path
        required: true
        schema:
          type: string
          title: Voice
      - name: book
        in: path
        required: true
        schema:
          type: string
          title: Book
      - name: chapter
        in: path
        required: true
        schema:
          type: string
          title: Chapter
      - name: api_key
        in: query
        required: false
        schema:
          title: Api Key
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    head:
      tags:
      - Audio
      - Audio
      summary: Get Audio File
      description: "Returns mp3 file with HTTP Range requests support for iOS/Android\
        \ players\n\nArgs:\n    translation: Translation code (e.g.: syn, rst, bsb)\n\
        \    voice: Voice code (e.g.: bondarenko, barry_hays)  \n    book: Book number\
        \ (e.g.: 01, 19, 40)\n    chapter: Chapter number (e.g.: 01, 14, 150)\n  \
        \  request: HTTP request\n    api_key: API key (query parameter or X-API-Key\
        \ header)\n    \nReturns:\n    Audio file or its part with correct headers"
      operationId: get_audio_file_api_audio__translation___voice___book___chapter__mp3_head
      parameters:
      - name: translation
        in: path
        required: true
        schema:
          type: string
          title: Translation
      - name: voice
        in: path
        required: true
        schema:
          type: string
          title: Voice
      - name: book
        in: path
        required: true
        schema:
          type: string
          title: Book
      - name: chapter
        in: path
        required: true
        schema:
          type: string
          title: Chapter
      - name: api_key
        in: query
        required: false
        schema:
          title: Api Key
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Audio
      - Audio
      summary: Get Audio File
      description: "Returns mp3 file with HTTP Range requests support for iOS/Android\
        \ players\n\nArgs:\n    translation: Translation code (e.g.: syn, rst, bsb)\n\
        \    voice: Voice code (e.g.: bondarenko, barry_hays)  \n    book: Book number\
        \ (e.g.: 01, 19, 40)\n    chapter: Chapter number (e.g.: 01, 14, 150)\n  \
        \  request: HTTP request\n    api_key: API key (query parameter or X-API-Key\
        \ header)\n    \nReturns:\n    Audio file or its part with correct headers"
      operationId: get_audio_file_api_audio__translation___voice___book___chapter__mp3_get
      parameters:
      - name: translation
        in: path
        required: true
        schema:
          type: string
          title: Translation
      - name: voice
        in: path
        required: true
        schema:
          type: string
          title: Voice
      - name: book
        in: path
        required: true
        schema:
          type: string
          title: Book
      - name: chapter
        in: path
        required: true
        schema:
          type: string
          title: Chapter
      - name: api_key
        in: query
        required: false
        schema:
          title: Api Key
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/data/manifest:
    get:
      tags:
      - Data
      summary: Get Data Manifest
      description: "The plan of a full resync, small enough to hold in memory.\n\n\
        Bible-API's full import used to be one 147 MB `GET /api/data`; on\n2026-08-30\
        \ parsing it OOM-killed the production VM. The import now walks\nthe translations\
        \ one at a time, and this endpoint is what tells it which\nones there are\
        \ and how many rows each must end up with:\n\n- `languages` / `bible_books`\
        \ \u2014 the reference tables in full (69 rows),\n  so the importer can write\
        \ them before any translation;\n- `translations` \u2014 `code` and `alias`\
        \ of every ACTIVE translation, the\n  work list (and, by omission, the list\
        \ of translations to drop);\n- `counts.per_translation` / `counts.totals`\
        \ \u2014 expected row counts per\n  table, the input of the importer's post-import\
        \ verification.\n\nCounting is cheap (aggregates over indexed columns, no\
        \ row transfer);\nthe response is a few kilobytes."
      operationId: getDataManifest
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/data:
    get:
      tags:
      - Data
      summary: Get Data
      description: 'Data export for Bible-API


        Without parameter: all active translations + voices + voice_alignments with
        COALESCE

        With parameter: data for a single translation'
      operationId: getData
      security:
      - APIKeyHeader: []
      parameters:
      - name: translation
        in: query
        required: false
        schema:
          description: Translation alias (optional)
          title: Translation
          type: string
        description: Translation alias (optional)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stats/summary:
    get:
      tags:
      - Statistics
      summary: Get Stats Summary
      operationId: get_stats_summary
      security:
      - HTTPBearer: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stats/recent:
    get:
      tags:
      - Statistics
      summary: Get Recent Requests
      operationId: get_recent_requests
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Get JWT token for access to administrative endpoints


        Token is valid for 24 hours and must be passed in the header:

        Authorization: Bearer <token>'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/languages:
    get:
      tags:
      - Languages
      summary: Get Languages
      operationId: get_languages
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LanguageModel'
                type: array
                title: Response Get Languages
      security:
      - APIKeyHeader: []
  /api/translations:
    get:
      tags:
      - Translations
      summary: Get Translations
      operationId: get_translations
      security:
      - APIKeyHeader: []
      parameters:
      - name: language
        in: query
        required: false
        schema:
          title: Language
          type: string
      - name: only_active
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Only Active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationModel'
                title: Response Get Translations
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translation_info:
    get:
      tags:
      - Translations
      summary: Get Translation Info
      operationId: get_translation_info
      security:
      - APIKeyHeader: []
      parameters:
      - name: translation
        in: query
        required: true
        schema:
          type: integer
          title: Translation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationInfoModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/translations/{translation_code}/books:
    get:
      tags:
      - Translations
      summary: Get Translation Books
      operationId: get_translation_books
      security:
      - APIKeyHeader: []
      parameters:
      - name: translation_code
        in: path
        required: true
        schema:
          type: integer
          title: Translation Code
      - name: voice_code
        in: query
        required: false
        schema:
          title: Voice Code
          type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationBookModel'
                title: Response Get Translation Books
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/cache/clear:
    post:
      tags:
      - Admin
      summary: Clear Cache
      description: Clear all cached data (requires JWT authentication)
      operationId: clear_cache
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/translations/{translation_code}:
    put:
      tags:
      - Translations
      summary: Update Translation
      operationId: update_translation
      security:
      - HTTPBearer: []
      parameters:
      - name: translation_code
        in: path
        required: true
        schema:
          type: integer
          title: Translation Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationUpdateModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/voices/{voice_code}:
    put:
      tags:
      - Voices
      summary: Update Voice
      operationId: update_voice
      security:
      - HTTPBearer: []
      parameters:
      - name: voice_code
        in: path
        required: true
        schema:
          type: integer
          title: Voice Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceUpdateModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/voices/{voice_code}/anomalies:
    get:
      tags:
      - Voices
      summary: Get Voice Anomalies
      operationId: get_voice_anomalies
      security:
      - HTTPBearer: []
      parameters:
      - name: voice_code
        in: path
        required: true
        schema:
          type: integer
          title: Voice Code
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: anomaly_type
        in: query
        required: false
        schema:
          title: Anomaly Type
          type: string
      - name: book_number
        in: query
        required: false
        schema:
          title: Book Number
          type: integer
      - name: status
        in: query
        required: false
        schema:
          title: Status
          type: string
      - name: sort_by
        in: query
        required: false
        schema:
          title: Sort By
          type: string
      - name: sort_order
        in: query
        required: false
        schema:
          title: Sort Order
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnomaliesResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/voices/anomalies:
    post:
      tags:
      - Voices
      summary: Create Voice Anomaly
      description: Create a new voice anomaly
      operationId: create_voice_anomaly
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceAnomalyCreateModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnomalyModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/voices/anomalies/{anomaly_code}/status:
    patch:
      tags:
      - Voices
      summary: Update Anomaly Status
      description: Update the status of a voice anomaly
      operationId: update_anomaly_status
      security:
      - HTTPBearer: []
      parameters:
      - name: anomaly_code
        in: path
        required: true
        schema:
          type: integer
          title: Anomaly Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyStatusUpdateModel'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceAnomalyModel'
        '422':
