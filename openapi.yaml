  /api/voices/manual-fixes:
    post:
      tags:
      - Voices
      summary: Create Voice Manual Fix
      description: 'Create manual time correction for verse


        Allows setting correct start and end time for verse without linking to anomaly.

        If correction for this verse already exists, it will be updated.'
      operationId: create_voice_manual_fix
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceManualFixCreateModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceManualFixModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    AnomalyStatus:
      type: string
      enum:
      - detected
      - confirmed
      - disproved
      - corrected
      - already_resolved
      - disproved_whisper
      title: AnomalyStatus
    AnomalyStatusUpdateModel:
      properties:
        status:
          $ref: '#/components/schemas/AnomalyStatus'
        begin:
          title: Begin
          type: number
        end:
          title: End
          type: number
      type: object
      required:
      - status
      title: AnomalyStatusUpdateModel
    BookInfoModel:
      properties:
        code:
          type: integer
          title: Code
        number:
          type: integer
          title: Number
        alias:
          type: string
          title: Alias
        name:
          type: string
          title: Name
        chapters_count:
          type: integer
          title: Chapters Count
      type: object
      required:
      - code
      - number
      - alias
      - name
      - chapters_count
      title: BookInfoModel
    ExcerptWithAlignmentModel:
      properties:
        title:
          type: string
          title: Title
        is_single_chapter:
          type: boolean
          title: Is Single Chapter
        parts:
          items:
            $ref: '#/components/schemas/PartsWithAlignmentModel'
          type: array
          title: Parts
      type: object
      required:
      - title
      - is_single_chapter
      - parts
      title: ExcerptWithAlignmentModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LanguageModel:
      properties:
        alias:
          type: string
          title: Alias
        name_en:
          type: string
          title: Name En
        name_national:
          type: string
          title: Name National
      type: object
      required:
      - alias
      - name_en
      - name_national
      title: LanguageModel
    LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
      description: Login request
    NoteModel:
      properties:
        code:
          type: integer
          title: Code
        number:
          type: integer
          title: Number
        text:
          type: string
          title: Text
        verse_code:
          title: Verse Code
          type: integer
        title_code:
          title: Title Code
          type: integer
        position_text:
          type: integer
          title: Position Text
        position_html:
          type: integer
          title: Position Html
      type: object
      required:
      - code
      - number
      - text
      - position_text
      - position_html
      title: NoteModel
    PartsWithAlignmentModel:
      properties:
        book:
          $ref: '#/components/schemas/BookInfoModel'
        chapter_number:
          type: integer
          title: Chapter Number
        audio_link:
          type: string
          title: Audio Link
        prev_excerpt:
          type: string
          title: Prev Excerpt
        next_excerpt:
          type: string
          title: Next Excerpt
        verses:
          items:
            $ref: '#/components/schemas/VerseWithAlignmentModel'
          type: array
          title: Verses
        notes:
          items:
            $ref: '#/components/schemas/NoteModel'
          type: array
          title: Notes
        titles:
          items:
            $ref: '#/components/schemas/TitleModel'
          type: array
          title: Titles
      type: object
      required:
      - book
      - chapter_number
      - audio_link
      - prev_excerpt
      - next_excerpt
      - verses
      - notes
      - titles
      title: PartsWithAlignmentModel
    SimpleErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: SimpleErrorResponse
    TitleModel:
      properties:
        code:
          type: integer
          title: Code
        text:
          type: string
          title: Text
        before_verse_code:
          title: Before Verse Code
          type: integer
        metadata:
          title: Metadata
          type: string
        reference:
          title: Reference
          type: string
        subtitle:
          type: boolean
          title: Subtitle
          default: false
        position_text:
          title: Position Text
          type: integer
        position_html:
          title: Position Html
          type: integer
      type: object
      required:
      - code
      - text
      title: TitleModel
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      title: Token
      description: Access token model
